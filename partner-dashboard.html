<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- PWA / iOS standalone（ホーム画面から全画面で開く） -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="やるゼ！">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex" />
<title>ダッシュボード｜やるゼ！ Partner</title>
<link rel="stylesheet" href="assets/style.css?v=20260430c" />
<style>
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin: 8px 0 4px 0;
  }
  .metric {
    border: 1px solid var(--line, #e3e3e0);
    border-radius: 6px;
    padding: 14px 16px;
    background: #fff;
  }
  .metric__label {
    font-size: 12px;
    color: #666;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .metric__value {
    font-size: 24px;
    font-weight: 700;
    color: #0a0e1a;
    font-variant-numeric: tabular-nums;
  }
  .metric__unit {
    font-size: 12px;
    color: #666;
    font-weight: 400;
    margin-left: 4px;
  }
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 9000;
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: #fff; border-radius: 8px; padding: 24px 28px;
    max-width: 460px; width: calc(100% - 32px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h3 { margin: 0 0 16px 0; font-size: 16px; }
  .modal .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px;
  }
  .credentials-box {
    background: #fff8e1;
    border: 1px solid #f7c85c;
    border-radius: 6px;
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 13px;
    line-height: 1.7;
  }
  .credentials-box .mono { font-weight: 700; font-size: 14px; }
  /* Phase 4-3a 按分率モーダル用追加スタイル */
  #shareModalWrap .modal { max-width: 520px; max-height: 90vh; overflow-y: auto; }
  .status-badge {
    display: inline-block; padding: 2px 8px; border-radius: 100px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  }
  .status-active     { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .status-pending    { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .status-expired    { background: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }

  /* v27 Phase 2.5 STEP4: モバイルでテーブルを縦積みカード化（横スクロール不要） */
  /* table に class="tbl-stack" を付けると ≤640px で各行がカード化される */
  /* 各 td に data-label="..." を入れることで左側にラベル、右側に値が表示される */
  /* td.td-summary: モバイルでだけ表示される要約行（折り畳み時に常時見える） */
  /* tr.compact: 折り畳み中（モバイル）状態 → td-summary と td-actions のみ表示 */
  .td-summary { display: none; }
  @media (max-width: 640px) {
    /* サマリーメトリクス：モバイルでも2列グリッド（縦長解消） */
    .metric-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .metric { padding: 10px 12px; }
    .metric__value { font-size: 18px; }
    .metric__label { font-size: 11px; margin-bottom: 2px; }
    .metric__unit { font-size: 11px; }

    .card table.tbl-stack { display: block; overflow-x: visible; white-space: normal; }
    .card table.tbl-stack thead { display: none; }
    .card table.tbl-stack tbody,
    .card table.tbl-stack tr { display: block; width: 100%; min-width: 0; }
    .card table.tbl-stack tr {
      border: 1px solid #e3e3e0;
      border-radius: 8px;
      margin-bottom: 8px;
      padding: 8px 12px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .card table.tbl-stack td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      white-space: normal;
      padding: 5px 0;
      border: none;
      border-bottom: 1px dashed #f1f1ef;
      font-size: 13px;
      min-height: 28px;
    }
    .card table.tbl-stack td:last-child { border-bottom: none; }
    .card table.tbl-stack td::before {
      content: attr(data-label);
      font-size: 11px;
      color: #666;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }
    .card table.tbl-stack td.td-actions {
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card table.tbl-stack td.td-actions::before { display: none; }
    .card table.tbl-stack td > * { text-align: right; }

    /* 折り畳みモード：td-summary を表示・通常 td を非表示 */
    .card table.tbl-stack td.td-summary {
      display: block;
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
      border-bottom: 1px solid #f1f1ef;
      margin-bottom: 4px;
    }
    .card table.tbl-stack td.td-summary::before { display: none; }
    .card table.tbl-stack td.td-summary > * { text-align: left; }
    .card table.tbl-stack td.td-summary .td-summary__title {
      font-size: 14px;
      font-weight: 700;
      color: #0a0e1a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .card table.tbl-stack td.td-summary .td-summary__sub {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }
    .card table.tbl-stack td.td-summary .td-summary__caret::after { content: '▼'; font-size: 10px; color: #999; }
    .card table.tbl-stack tr.compact td.td-summary .td-summary__caret::after { content: '▶'; }
    .card table.tbl-stack tr.compact td:not(.td-summary):not(.td-actions) { display: none; }
    .card table.tbl-stack tr.compact td.td-summary { border-bottom: none; margin-bottom: 0; padding: 2px 0; }
  }
  /* デスクトップ（>640px）では td-summary は常時非表示 */

  /* v27 Phase 2.5 STEP4 (本格版): 検索ボックス・ページネーター */
  .tbl-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .tbl-toolbar input[type="search"] {
    flex: 1;
    min-width: 0;
    padding: 7px 12px;
    font-size: 13px;
    border: 1px solid #d6d6d2;
    border-radius: 6px;
    background: #fff;
  }
  .tbl-toolbar input[type="search"]:focus {
    outline: none;
    border-color: #c4432b;
  }
  .tbl-toolbar .tbl-toolbar__count {
    font-size: 11px;
    color: #999;
    flex-shrink: 0;
  }
  .tbl-pager {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .tbl-pager button {
    min-width: 32px;
    height: 30px;
    padding: 0 8px;
    font-size: 12px;
    border: 1px solid #d6d6d2;
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: #333;
  }
  .tbl-pager button:hover:not(:disabled) { background: #f7f6f3; }
  .tbl-pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  .tbl-pager button.is-active { background: #c4432b; color: #fff; border-color: #c4432b; }
  .tbl-pager .tbl-pager__info { font-size: 11px; color: #666; margin: 0 8px; }
</style>
</head>
<body>
<div id="adapt-header"></div>

<main class="container">
  <section class="page-intro">
    <p class="section-label">Partner Dashboard</p>
    <h1 id="pageTitle">ダッシュボード</h1>
    <p id="pageSubtitle">読み込み中…</p>
  </section>

  <div class="stack">

    <!-- サマリーメトリクス -->
    <section class="card">
      <h2 class="panel-title">サマリー</h2>
      <div id="summaryContent">
        <p class="muted">読み込み中…</p>
      </div>
    </section>

    <!-- 収益推移（Master Resellerのみ表示・v29 Phase 5/6） -->
    <section class="card" id="trendCard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
        <h2 class="panel-title" style="margin:0;">収益推移</h2>
        <button class="btn btn--ghost btn--sm" id="trendToggleBtn" type="button">▶ 推移を見る</button>
      </div>
      <div id="trendBody" style="display:none;"></div>
    </section>

    <!-- 自分の情報 -->
    <section class="card">
      <h2 class="panel-title" id="selfInfoTitle">アカウント情報</h2>
      <table id="selfTbl"></table>
    </section>

    <!-- Reseller（Master Resellerのみ表示） -->
    <section class="card" id="subAgentsCard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h2 class="panel-title" style="margin:0;">Reseller</h2>
        <button class="btn btn--primary btn--sm" id="addAgentBtn" type="button">＋ Resellerを登録</button>
      </div>
      <div id="subAgentsContent"></div>
    </section>

    <!-- ご紹介先企業 -->
    <section class="card">
      <h2 class="panel-title">ご紹介先企業</h2>
      <div id="customersContent"></div>
    </section>

  </div>
</main>

<!-- Reseller登録モーダル -->
<div id="modalWrap" style="display:none;"></div>

<script src="assets/common.js?v=20260430c"></script>
<script>
(async function () {
  // Resellerログインチェック
  const r = await Adapt.requirePartnerLogin('partner-login.html');
  if (!r) return;
  Adapt.renderPartnerHeader({ active: 'dashboard' });

  const p = r.partner;
  const isSuper = p.type === 'super';
  const roleLabel = isSuper ? 'Master Reseller' : 'Reseller';

  // タイトルとセクション見出しをユーザー種別に応じて動的にセット
  document.title = roleLabel + 'ダッシュボード｜やるゼ！';
  document.getElementById('pageTitle').textContent = roleLabel + 'ダッシュボード';
  document.getElementById('selfInfoTitle').textContent = roleLabel + '情報';

  document.getElementById('pageSubtitle').textContent =
    roleLabel + ' / ' + p.company_name;

  // --- 自分の情報テーブル ---
  document.getElementById('selfTbl').innerHTML = `
    <tr><th style="width:180px">${isSuper ? 'Master Resellerコード' : 'Resellerコード'}</th><td class="mono">${Adapt.escapeHTML(p.code)}</td></tr>
    <tr><th>種別</th><td>${isSuper ? 'Master Reseller' : 'Reseller'}</td></tr>
    <tr><th>会社名</th><td>${Adapt.escapeHTML(p.company_name)}</td></tr>
    <tr><th>ログインID</th><td class="mono">${Adapt.escapeHTML(p.login_id)}</td></tr>
    <tr><th>メール</th><td>${Adapt.escapeHTML(p.email || '-')}</td></tr>
    <tr><th>電話</th><td>${Adapt.escapeHTML(p.phone || '-')}</td></tr>
    <tr><th>契約開始日</th><td class="mono">${formatDate(p.contract_start_at)}</td></tr>
    <tr><th>契約終了予定日</th><td class="mono">${formatDate(p.contract_end_at)}</td></tr>
    ${p.parent ? `<tr><th>ご担当の Master Reseller</th><td><span class="mono">${Adapt.escapeHTML(p.parent.code)}</span> ${Adapt.escapeHTML(p.parent.company_name)}</td></tr>` : ''}
    ${isSuper && p.revenue_share_pct != null ? `<tr><th>按分率（タムジ→自社）</th><td class="mono">${p.revenue_share_pct}%</td></tr>` : ''}
  `;

  // --- サマリー取得 ---
  const summaryEl = document.getElementById('summaryContent');
  try {
    const s = await PartnerAPI.call('/api/partner/dashboard');
    const sm = s.summary;
    const ledger = sm.current_month_ledger;
    const metrics = [];
    metrics.push(`
      <div class="metric">
        <div class="metric__label">ご紹介先企業</div>
        <div class="metric__value">${sm.customer_count}<span class="metric__unit">社</span></div>
      </div>`);
    metrics.push(`
      <div class="metric">
        <div class="metric__label">有料契約中</div>
        <div class="metric__value">${sm.active_subscription_count}<span class="metric__unit">件</span></div>
      </div>`);
    if (isSuper && sm.sub_agent_count != null) {
      metrics.push(`
        <div class="metric">
          <div class="metric__label">Reseller</div>
          <div class="metric__value">${sm.sub_agent_count}<span class="metric__unit">社</span></div>
        </div>`);
    }
    if (isSuper && ledger) {
      metrics.push(`
        <div class="metric">
          <div class="metric__label">当月売上（${ledger.year_month}）</div>
          <div class="metric__value">¥${ledger.gross_amount.toLocaleString()}</div>
        </div>`);
      metrics.push(`
        <div class="metric">
          <div class="metric__label">当月支払予定（按分後）</div>
          <div class="metric__value">¥${ledger.share_amount.toLocaleString()}</div>
        </div>`);
    }
    summaryEl.innerHTML = `<div class="metric-grid">${metrics.join('')}</div>
      ${!isSuper ? '<p class="muted" style="font-size:12px; margin:10px 0 0 0;">売上情報はMaster Resellerから共有されます（タムジ社台帳は表示されません）。</p>' : ''}`;
  } catch (e) {
    summaryEl.innerHTML = `<div class="msg msg--err">サマリー取得失敗: ${Adapt.escapeHTML(e.message)}</div>`;
  }

  // --- v29 Phase 5/6: 収益推移カード（Master Resellerのみ） ---
  if (isSuper) {
    document.getElementById('trendCard').style.display = '';
    initTrendCard();
  }

  // --- Reseller一覧（Master Resellerのみ） ---
  if (isSuper) {
    document.getElementById('subAgentsCard').style.display = '';
    loadSubAgents();
    document.getElementById('addAgentBtn').addEventListener('click', openAddAgentModal);
  }

  // v29 Phase 5/6: 収益推移カード制御
  let _trendChartLibLoaded = false;
  let _trendDataLoaded = false;
  let _trendData = null;
  let _trendOpen = false;
  function initTrendCard() {
    const btn = document.getElementById('trendToggleBtn');
    const body = document.getElementById('trendBody');
    btn.addEventListener('click', async () => {
      _trendOpen = !_trendOpen;
      btn.textContent = _trendOpen ? '▼ 推移を閉じる' : '▶ 推移を見る';
      body.style.display = _trendOpen ? '' : 'none';
      if (_trendOpen && !_trendDataLoaded) {
        body.innerHTML = '<p class="muted" style="padding:16px 0;">読み込み中…</p>';
        try {
          await loadTrendChartLib();
          _trendData = await PartnerAPI.call('/api/partner/me/revenue-trend?months=12');
          _trendDataLoaded = true;
          renderTrendBody();
        } catch (e) {
          body.innerHTML = `<div class="msg msg--err">推移取得失敗: ${Adapt.escapeHTML(e.message)}</div>`;
        }
      }
    });
  }
  async function loadTrendChartLib() {
    if (_trendChartLibLoaded || window.Chart) { _trendChartLibLoaded = true; return; }
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1';
      s.onload = res;
      s.onerror = () => rej(new Error('Chart.js ロード失敗'));
      document.head.appendChild(s);
    });
    _trendChartLibLoaded = true;
  }
  function renderTrendBody() {
    const body = document.getElementById('trendBody');
    const d = _trendData;
    const cm = d.current_month || { year_month: '-', gross_amount: 0, share_amount: 0 };
    const pm = d.prev_month || { year_month: '-', gross_amount: 0, share_amount: 0 };
    const diffPct = pm.gross_amount > 0 ? Math.round((cm.gross_amount - pm.gross_amount) / pm.gross_amount * 100) : null;
    const diffStr = diffPct === null ? '—' : (diffPct >= 0 ? '+' : '') + diffPct + '%';
    const diffColor = diffPct === null ? '#666' : (diffPct >= 0 ? '#16a34a' : '#dc2626');
    body.innerHTML = `
      <div class="metric-grid" style="margin-bottom:18px;">
        <div class="metric">
          <div class="metric__label">当月売上（${cm.year_month}）</div>
          <div class="metric__value">¥${(cm.gross_amount||0).toLocaleString()}</div>
          <div style="font-size:12px;color:${diffColor};margin-top:4px;">前月比 ${diffStr}（前月: ¥${(pm.gross_amount||0).toLocaleString()}）</div>
        </div>
        <div class="metric">
          <div class="metric__label">当月支払予定（按分後）</div>
          <div class="metric__value">¥${(cm.share_amount||0).toLocaleString()}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr;gap:24px;">
        <div>
          <h4 style="margin:0 0 8px 0;font-size:13px;color:#444;">月次推移（直近12ヶ月）</h4>
          <div style="position:relative;height:260px;"><canvas id="trendChartMonthly"></canvas></div>
        </div>
        <div>
          <h4 style="margin:0 0 8px 0;font-size:13px;color:#444;">四半期推移（直近8Q）</h4>
          <div style="position:relative;height:260px;"><canvas id="trendChartQuarterly"></canvas></div>
        </div>
        <div>
          <h4 style="margin:0 0 8px 0;font-size:13px;color:#444;">年次推移</h4>
          <div style="position:relative;height:260px;"><canvas id="trendChartYearly"></canvas></div>
        </div>
      </div>
      ${(d.monthly || []).length === 0 ? '<p class="muted" style="font-size:12px;margin-top:12px;">まだ推移データがありません（月次台帳の集計後に表示されます）。</p>' : ''}
    `;
    drawTrendLineChart('trendChartMonthly', (d.monthly || []).map(r => r.year_month), (d.monthly || []).map(r => r.gross_amount), (d.monthly || []).map(r => r.share_amount));
    drawTrendBarChart('trendChartQuarterly', (d.quarterly || []).map(r => r.quarter), (d.quarterly || []).map(r => r.gross_amount), (d.quarterly || []).map(r => r.share_amount));
    drawTrendBarChart('trendChartYearly', (d.yearly || []).map(r => r.year), (d.yearly || []).map(r => r.gross_amount), (d.yearly || []).map(r => r.share_amount));
  }
  function drawTrendLineChart(canvasId, labels, gross, share) {
    const el = document.getElementById(canvasId);
    if (!el || !window.Chart) return;
    new Chart(el.getContext('2d'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: '売上総額', data: gross, borderColor: '#0891b2', backgroundColor: 'rgba(8,145,178,0.1)', tension: 0.3, fill: false },
          { label: '按分後（自社）', data: share, borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.1)', tension: 0.3, fill: false }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } },
        scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + Number(v).toLocaleString() } } }
      }
    });
  }
  function drawTrendBarChart(canvasId, labels, gross, share) {
    const el = document.getElementById(canvasId);
    if (!el || !window.Chart) return;
    new Chart(el.getContext('2d'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: '売上総額', data: gross, backgroundColor: '#0891b2' },
          { label: '按分後（自社）', data: share, backgroundColor: '#16a34a' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } },
        scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + Number(v).toLocaleString() } } }
      }
    });
  }

  // Reseller 一覧（Master Reseller のみ）
  let _subAgentsCache = [];
  let _subAgentsState = { search: '', page: 1, pageSize: 20 };
  async function loadSubAgents() {
    const el = document.getElementById('subAgentsContent');
    el.innerHTML = '<p class="muted">読み込み中…</p>';
    try {
      const r = await PartnerAPI.call('/api/partner/sub-agents');
      _subAgentsCache = r.sub_agents || [];
      renderSubAgents();
    } catch (e) {
      el.innerHTML = `<div class="msg msg--err">取得失敗: ${Adapt.escapeHTML(e.message)}</div>`;
    }
  }

  function renderSubAgents() {
    const el = document.getElementById('subAgentsContent');
    const full = _subAgentsCache;
    const state = _subAgentsState;
    if (full.length === 0) {
      el.innerHTML = `<p class="muted">まだResellerが登録されていません。右上の「＋ Resellerを登録」から追加してください。</p>`;
      return;
    }
    const filtered = _applySearch(full, state.search, a => [a.code, a.company_name, a.login_id, a.email]);
    const pageInfo = _paginate(filtered, state.page, state.pageSize);

    el.innerHTML = `
        <div class="tbl-toolbar">
          <input id="subAgentSearch" type="search" placeholder="🔍 コード・会社名・ログインID・メールで検索"
                 value="${Adapt.escapeHTML(state.search)}" />
          <span class="tbl-toolbar__count">${pageInfo.total}件 該当</span>
        </div>
        <table class="tbl-stack">
          <thead><tr>
            <th>コード</th><th>会社名</th><th>ログインID</th><th>メール</th>
            <th>ご紹介先企業</th><th>按分率</th><th>契約終了</th><th>状態</th><th>操作</th>
          </tr></thead>
          <tbody>
            ${pageInfo.items.map(a => {
              const summaryHtml = `
                <td class="td-summary">
                  <div class="td-summary__title">
                    <span>${Adapt.escapeHTML(a.company_name)}</span>
                    <span class="td-summary__caret"></span>
                  </div>

  // --- v27 Phase 2.5 STEP4 本格版: テーブル一覧の共通ユーティリティ ---
  // フィルタ + ページネーション + モバイル折り畳み対応の補助
  function _applySearch(list, search, getKeysFn) {
    if (!search) return list;
    const q = search.toLowerCase().trim();
    if (!q) return list;
    return list.filter(item => {
      const keys = getKeysFn(item);
      return keys.some(k => String(k || '').toLowerCase().includes(q));
    });
  }
  function _paginate(list, page, pageSize) {
    const total = list.length;
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    const safePage = Math.min(Math.max(1, page), totalPages);
    const start = (safePage - 1) * pageSize;
    return {
      items: list.slice(start, start + pageSize),
      page: safePage,
      pageSize,
      total,
      totalPages,
      from: total === 0 ? 0 : start + 1,
      to: Math.min(start + pageSize, total),
    };
  }
  function _renderPager(pageInfo, onPageChange) {
    const { page, totalPages, from, to, total } = pageInfo;
    if (totalPages <= 1) {
      return `<div class="tbl-pager"><span class="tbl-pager__info">${total}件</span></div>`;
    }
    // ページボタンを最大7個表示（前後省略）
    const pages = [];
    const window = 1;
    const add = (p) => pages.push(p);
    add(1);
    if (page - window > 2) add('...');
    for (let p = Math.max(2, page - window); p <= Math.min(totalPages - 1, page + window); p++) add(p);
    if (page + window < totalPages - 1) add('...');
    if (totalPages > 1) add(totalPages);
    const buttons = pages.map(p => p === '...'
      ? `<span class="tbl-pager__info">...</span>`
      : `<button type="button" class="${p === page ? 'is-active' : ''}" data-pager-page="${p}">${p}</button>`
    ).join('');
    return `
      <div class="tbl-pager">
        <button type="button" data-pager-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹</button>
        ${buttons}
        <button type="button" data-pager-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''}>›</button>
        <span class="tbl-pager__info">${from}-${to} / ${total}件</span>
      </div>`;
  }
  function _bindPager(rootEl, onPageChange) {
    rootEl.querySelectorAll('[data-pager-page]').forEach(b => {
      b.addEventListener('click', (e) => {
        const p = parseInt(e.currentTarget.getAttribute('data-pager-page'), 10);
        if (!isNaN(p)) onPageChange(p);
      });
    });
  }
  function _bindFolding(rootEl) {
    // td.td-summary タップで tr.compact をトグル（モバイル折り畳み）
    rootEl.querySelectorAll('td.td-summary').forEach(td => {
      td.addEventListener('click', (e) => {
        // ボタンクリックは伝播停止しているので、ここに来るのは要約部分のクリックのみ
        const tr = e.currentTarget.closest('tr');
        if (tr) tr.classList.toggle('compact');
      });
    });
  }

  // --- v27 Phase 2.5: 顧客企業の課金履歴モーダル ---
  function brandToLabel(b) {
    const m = { 'VISA':'VISA', 'MASTERCARD':'Mastercard', 'AMERICAN_EXPRESS':'AMEX', 'JCB':'JCB', 'DISCOVER':'Discover', 'DISCOVER_DINERS':'Diners', 'CHINA_UNIONPAY':'銀聯' };
    return m[String(b||'').toUpperCase()] || String(b || 'カード');
  }
  function renderBillingEvent(ev) {
    const dt = new Date(ev.created_at);
    const pad = (n) => String(n).padStart(2, '0');
    const tsLabel = dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate()) + ' ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
    const d = ev.event_data || {};
    let summary = '';
    if (ev.event_type === 'subscription_started') {
      const mc = d.member_count || 1;
      const amt = d.amount_jpy || (200 * mc);
      summary = '契約開始（' + mc + '名・¥' + amt.toLocaleString() + '/月）';
    } else if (ev.event_type === 'subscription_resumed') {
      const mc = d.member_count || 1;
      const amt = d.amount_jpy || (200 * mc);
      summary = '再契約（' + mc + '名・¥' + amt.toLocaleString() + '/月）';
    } else if (ev.event_type === 'card_changed') {
      const oc = d.old_card, nc = d.new_card || {};
      const ncStr = brandToLabel(nc.brand) + ' •••• ' + (nc.last_4 || '****');
      if (oc && oc.last_4) {
        summary = 'カード変更：' + brandToLabel(oc.brand) + ' •••• ' + oc.last_4 + ' → ' + ncStr;
      } else {
        summary = 'カード登録：' + ncStr;
      }
    } else if (ev.event_type === 'cancelled') {
      summary = '解約（即時）';
    } else if (ev.event_type === 'cancel_scheduled') {
      const mm = d.scheduled_cancel_month || '';
      let ymLabel = '';
      if (mm) {
        const parts = mm.split('-');
        ymLabel = parts[0] + '年' + parseInt(parts[1] || '0', 10) + '月';
      }
      summary = '解約予約：' + ymLabel + '末';
    } else if (ev.event_type === 'unschedule_cancel') {
      summary = '解約予約 取消';
    } else {
      summary = ev.event_type;
    }
    const appLabel = ev.app_name === 'medadapt' ? 'ｍやるゼ！' : ev.app_name === 'onetouch' ? 'ｔやるゼ！' : (ev.app_name || '');
    const actor = ev.actor_name ? (ev.actor_name + '（' + (ev.actor_login_id || '') + '）') : (ev.actor_login_id || '-');
    return `
      <div style="padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;line-height:1.6;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
          <div style="font-weight:600;color:#222;">${Adapt.escapeHTML(summary)}</div>
          <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:${ev.app_name === 'medadapt' ? '#e0f2fe;color:#0c4a6e' : '#fff7ed;color:#9a3412'}">${Adapt.escapeHTML(appLabel)}</span>
        </div>
        <div style="font-size:11px;color:#64748b;margin-top:4px;">${Adapt.escapeHTML(tsLabel + ' ・ ' + actor)}</div>
      </div>`;
  }

            <div>Resellerコード: <span class="mono">${Adapt.escapeHTML(agent.code)}</span></div>
            <div>ログインID: <span class="mono">${Adapt.escapeHTML(agent.login_id)}</span></div>
            <div>初期パスワード: <span class="mono">${Adapt.escapeHTML(plainPassword)}</span></div>
            <div style="margin-top:6px; font-size:11px; color:#8a6400;">
              ※ このパスワードは再表示されません。必ずコピーして控えてください。
            </div>
          </div>
          <p style="font-size:12px; color:#555;">
            Reseller側のログインURL: <br>
            <a href="partner-login.html" target="_blank" class="mono" style="word-break:break-all;">${location.origin}/partner-login.html</a>
          </p>
          <div class="modal-actions">
            <button class="btn btn--primary" id="credOkBtn" type="button">閉じる</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('credOkBtn').addEventListener('click', closeModal);
  }

  // --- ユーティリティ ---
  function formatDate(s) {
    if (!s) return '-';
    const d = new Date(s.replace(' ', 'T') + (s.endsWith('Z') ? '' : 'Z'));
    if (isNaN(d)) return s;
    return d.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
  }
  function statusLabel(s) {
    const map = { active: '稼働中', pending: '承認待ち', expired: '契約終了', terminated: '停止' };
    return map[s] || s;
  }

  // =====================================================
  // Phase 4-3a: Resellerへの按分率編集・履歴モーダル
  // super → agent scope・/api/partner/sub-agents/:id/share[-history]
  // =====================================================
  function getShareModalWrap() {
    let wrap = document.getElementById('shareModalWrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.id = 'shareModalWrap';
      document.body.appendChild(wrap);
    }
    return wrap;
  }
  function closeShareModal() {
    const wrap = document.getElementById('shareModalWrap');
    if (wrap) wrap.innerHTML = '';
  }
  function todayYMD() {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  function firstOfNextMonthYMD() {
    const d = new Date();
    const y = d.getMonth() === 11 ? d.getFullYear() + 1 : d.getFullYear();
    const m = d.getMonth() === 11 ? 1 : d.getMonth() + 2;
    return y + '-' + String(m).padStart(2, '0') + '-01';
  }

  async function openSubAgentShareEditModal({ agentId, companyName, currentPct, parentPct }) {
    const wrap = getShareModalWrap();
    const parentInfo = parentPct != null
      ? `<div style="padding:6px 10px;background:#fff8e1;border-left:3px solid #f7c85c;margin:0 0 10px 0;font-size:12px;">
           あなた（Master Reseller）の取得率: <strong>${parentPct}%</strong>（この値を超えて設定はできません）
         </div>`
      : '';
    wrap.innerHTML = `
      <div class="modal-backdrop" id="shareBackdrop">
        <div class="modal">
          <h3>按分率の変更 - ${Adapt.escapeHTML(agentId)}</h3>
          <p style="font-size:12px;color:#666;margin:0 0 12px 0;">${Adapt.escapeHTML(companyName || '')}</p>
          ${parentInfo}
          <div style="padding:8px 10px;background:#f9fafb;border-radius:4px;margin-bottom:12px;font-size:13px;">
            現在のReseller按分率：<strong>${currentPct != null ? currentPct + '%' : '未設定'}</strong>
          </div>
          <div id="shareEditMsg"></div>
          <form id="shareEditForm" class="stack" novalidate>
            <div class="field">
              <label for="newPct">新しい按分率（%）<span class="req">*</span></label>
              <input id="newPct" type="number" step="0.1" min="0" max="${parentPct ?? 100}" required />
              <p style="font-size:11px;color:#666;margin:4px 0 0 0;">
                Resellerへの按分率。上限 = あなたの取得率。
              </p>
            </div>
            <div class="field">
              <label for="effFrom">発効日 <span class="req">*</span></label>
              <input id="effFrom" type="date" value="${firstOfNextMonthYMD()}" required />
              <p style="font-size:11px;color:#666;margin:4px 0 0 0;">
                月初日（1日）を推奨。日割り計算は行われません。
              </p>
            </div>
            <div class="field">
              <label for="shareNote">変更理由・備考</label>
              <textarea id="shareNote" rows="2" maxlength="500" placeholder="例: 契約更新に伴う調整"></textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="shareEditCancel">キャンセル</button>
              <button type="submit" class="btn btn--primary" id="shareEditSubmit">変更を保存</button>
            </div>
          </form>
        </div>
      </div>`;
    document.getElementById('shareBackdrop').addEventListener('click', e => {
      if (e.target.id === 'shareBackdrop') closeShareModal();
    });
    document.getElementById('shareEditCancel').addEventListener('click', closeShareModal);
    document.getElementById('shareEditForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const msgEl = document.getElementById('shareEditMsg');
      const submitBtn = document.getElementById('shareEditSubmit');
      msgEl.innerHTML = '';

      const pct = Number(document.getElementById('newPct').value);
      const effFrom = document.getElementById('effFrom').value;
      const note = document.getElementById('shareNote').value;
      if (Number.isNaN(pct) || pct < 0 || pct > 100) {
        msgEl.innerHTML = `<div class="msg msg--err">按分率は 0〜100 の数値を入力してください。</div>`;
        return;
      }
      if (!effFrom) {
        msgEl.innerHTML = `<div class="msg msg--err">発効日を入力してください。</div>`;
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = '保存中…';
      try {
        const r = await PartnerAPI.call(`/api/partner/sub-agents/${agentId}/share`, {
          method: 'POST',
          body: { pct, effective_from: effFrom, note }
        });
        Adapt.toast(`按分率を ${r.pct}% に変更しました（発効: ${r.effective_from}）`, 'success');
        closeShareModal();
        loadSubAgents();
      } catch (e) {
        const errMap = {
          invalid_pct: '按分率が不正です（0〜100・小数点第一位まで）',
          invalid_date: '発効日が不正です',
          note_too_long: '備考は500文字以内で入力してください',
          effective_before_contract: '発効日は契約開始日以降を指定してください',
          not_your_sub_agent: '権限がありません（あなたのResellerではありません）',
          forbidden_super_only: 'この操作はMaster Resellerのみ可能です',
          parent_share_not_set: 'あなたの取得率（タムジ→自社）が未設定です。管理者に連絡してください',
          partner_not_found: '対象が見つかりません'
        };
        let errMsg = errMap[e.message];
        // pct_exceeds_parent_share はメッセージをAPI側で生成している
        if (e.message === 'pct_exceeds_parent_share' || /pct_exceeds_parent_share/.test(e.message)) {
          errMsg = e.data?.message || `あなたの取得率（${parentPct}%）を超えて設定はできません`;
        }
        msgEl.innerHTML = `<div class="msg msg--err">${errMsg || 'エラー: ' + e.message}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = '変更を保存';
      }
    });
  }

  async function openSubAgentShareHistoryModal({ agentId, companyName }) {
    const wrap = getShareModalWrap();
    wrap.innerHTML = `
      <div class="modal-backdrop" id="shareBackdrop">
        <div class="modal">
          <h3>按分率の変更履歴 - ${Adapt.escapeHTML(agentId)}</h3>
          <p style="font-size:12px;color:#666;margin:0 0 12px 0;">${Adapt.escapeHTML(companyName || '')}</p>
          <div id="shareHistContent"><p class="muted">読み込み中…</p></div>
          <div class="modal-actions">
            <button type="button" class="btn btn--primary" id="shareHistClose">閉じる</button>
          </div>
        </div>
      </div>`;
    document.getElementById('shareBackdrop').addEventListener('click', e => {
      if (e.target.id === 'shareBackdrop') closeShareModal();
    });
    document.getElementById('shareHistClose').addEventListener('click', closeShareModal);
    try {
      const r = await PartnerAPI.call(`/api/partner/sub-agents/${agentId}/share-history`);
      const list = r.history || [];
      const c = document.getElementById('shareHistContent');
      if (list.length === 0) {
        c.innerHTML = `<p class="muted">履歴はまだありません。右上の [按分率] から初回設定を行ってください。</p>`;
        return;
      }
      c.innerHTML = list.map((h) => {
        const active = (!h.effective_to && h.effective_from <= todayYMD());
        const future = h.effective_from > todayYMD();
        const label = active ? '現在' : (future ? '未来発効' : '過去');
        const tagClass = active ? 'status-active' : (future ? 'status-pending' : 'status-expired');
        return `
          <div style="border:1px solid #e3e3e0;border-radius:6px;padding:10px 12px;margin-bottom:8px;${active ? 'background:#fff8e1;' : ''}">
            <div style="display:flex;justify-content:space-between;align-items:baseline;">
              <div><span class="status-badge ${tagClass}">${label}</span> <strong style="font-size:16px;margin-left:6px;">${h.pct}%</strong></div>
              <div class="mono" style="font-size:11px;color:#666;">#${h.id}</div>
            </div>
            <div class="mono" style="font-size:12px;color:#444;margin-top:4px;">
              発効: ${h.effective_from}${h.effective_to ? ' 〜 ' + h.effective_to : ' 〜 現在有効'}
            </div>
            <div style="font-size:11px;color:#666;margin-top:2px;">
              設定: ${Adapt.escapeHTML(h.set_by || '-')} / ${formatDate(h.created_at)}
            </div>
            ${h.note ? `<div style="font-size:12px;margin-top:4px;padding:4px 8px;background:#f9fafb;border-radius:3px;">${Adapt.escapeHTML(h.note)}</div>` : ''}
          </div>
        `;
      }).join('');
    } catch (e) {
      document.getElementById('shareHistContent').innerHTML =
        `<div class="msg msg--err">取得失敗: ${Adapt.escapeHTML(e.message)}</div>`;
    }
  }

  // =====================================================
  // Phase 4-3e: Reseller詳細モーダル（super 側）
  // GET /api/partner/sub-agents/:agent_id/customers
  // =====================================================
  async function openSubAgentDetailModal({ agentId, agentCode, companyName }) {
    const wrap = getShareModalWrap();
    wrap.innerHTML = `
      <div class="modal-backdrop" id="detailBackdrop">
        <div class="modal" style="max-width:760px;">
          <h3>Reseller詳細 - ${Adapt.escapeHTML(agentId)}</h3>
          <p style="font-size:12px;color:#666;margin:0 0 12px 0;">
            ${Adapt.escapeHTML(companyName || '')} <span class="mono" style="margin-left:8px;">コード: ${Adapt.escapeHTML(agentCode || '-')}</span>
          </p>
          <div id="subDetailContent"><p class="muted">読み込み中…</p></div>
          <div class="modal-actions">
            <button type="button" class="btn btn--primary" id="subDetailClose">閉じる</button>
          </div>
        </div>
      </div>`;
    document.getElementById('detailBackdrop').addEventListener('click', e => {
      if (e.target.id === 'detailBackdrop') closeShareModal();
    });
    document.getElementById('subDetailClose').addEventListener('click', closeShareModal);
    try {
      const r = await PartnerAPI.call(`/api/partner/sub-agents/${agentId}/customers`);
      const list = r.customers || [];
      const c = document.getElementById('subDetailContent');
      if (list.length === 0) {
        c.innerHTML = `
          <p class="muted">このResellerにはまだご紹介先企業がいません。</p>
          <p style="font-size:12px;color:#666;">相手先にパートナーコード「<strong class="mono">${Adapt.escapeHTML(agentCode || '-')}</strong>」を案内して、ご紹介先企業の登録を促してください。</p>
        `;
        return;
      }
      const totalStaff = list.reduce((s, x) => s + (x.staff_count || 0), 0);
      const totalActiveSubs = list.reduce((s, x) => s + (x.active_subs || 0), 0);

      // モーダル内：検索 + ページネーション state（モーダル閉じれば破棄）
      const detailState = { search: '', page: 1, pageSize: 20 };
      const renderDetail = () => {
        const filtered = _applySearch(list, detailState.search, cu => [cu.company_id, cu.name, cu.email]);
        const pageInfo = _paginate(filtered, detailState.page, detailState.pageSize);
        c.innerHTML = `
          <div class="metric-grid" style="margin-bottom:12px;">
            <div class="metric">
              <div class="metric__label">ご紹介先企業</div>
              <div class="metric__value">${list.length}<span class="metric__unit">社</span></div>
            </div>
            <div class="metric">
              <div class="metric__label">合計スタッフ数</div>
              <div class="metric__value">${totalStaff}<span class="metric__unit">名</span></div>
            </div>
            <div class="metric">
              <div class="metric__label">有料契約</div>
              <div class="metric__value">${totalActiveSubs}<span class="metric__unit">件</span></div>
            </div>
          </div>
          <h4 style="margin:0 0 8px 0;font-size:13px;color:#c4432b;">ご紹介先企業一覧</h4>
          <div class="tbl-toolbar">
            <input id="subDetailSearch" type="search" placeholder="🔍 会社名・会社ID・メールで検索"
                   value="${Adapt.escapeHTML(detailState.search)}" />
            <span class="tbl-toolbar__count">${pageInfo.total}件 該当</span>
          </div>
          <div style="max-height:50vh;overflow-y:auto;">
          <table class="tbl-stack" style="font-size:12px;">
            <thead><tr>
              <th>会社ID</th><th>会社名</th><th>メール</th><th>スタッフ</th><th>有料契約</th><th>登録日</th>
            </tr></thead>
            <tbody>
              ${pageInfo.items.map(cu => {
                const summaryHtml = `
                  <td class="td-summary">
                    <div class="td-summary__title">
                      <span>${Adapt.escapeHTML(cu.name)}</span>
                      <span class="td-summary__caret"></span>
                    </div>
                    <div class="td-summary__sub">${Adapt.escapeHTML(cu.company_id)} ・ 有料 ${cu.active_subs}件</div>
                  </td>`;
                return `
                <tr class="compact" data-id="${Adapt.escapeHTML(cu.company_id)}">
                  ${summaryHtml}
                  <td data-label="会社ID" class="mono">${Adapt.escapeHTML(cu.company_id)}</td>
                  <td data-label="会社名">${Adapt.escapeHTML(cu.name)}</td>
                  <td data-label="メール">${Adapt.escapeHTML(cu.email || '-')}</td>
                  <td data-label="スタッフ" class="mono">${cu.staff_count}</td>
                  <td data-label="有料契約" class="mono">${cu.active_subs}</td>
                  <td data-label="登録日" class="mono">${formatDate(cu.created_at)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          </div>
          ${_renderPager(pageInfo)}
        `;
        const sEl = document.getElementById('subDetailSearch');
        if (sEl) {
          let timer = null;
          sEl.addEventListener('input', (e) => {
            if (timer) clearTimeout(timer);
            const v = e.target.value;
            timer = setTimeout(() => { detailState.search = v; detailState.page = 1; renderDetail(); }, 200);
          });
        }
        _bindPager(c, (p) => { detailState.page = p; renderDetail(); });
        _bindFolding(c);
      };
      renderDetail();
    } catch (e) {
      const errMap = {
        not_your_sub_agent: '権限がありません（あなたのResellerではありません）',
        forbidden_super_only: 'この操作はMaster Resellerのみ可能です',
        partner_not_found: '対象が見つかりません'
      };
      document.getElementById('subDetailContent').innerHTML =
        `<div class="msg msg--err">${errMap[e.message] || '取得失敗: ' + Adapt.escapeHTML(e.message)}</div>`;
    }
  }
})();
</script>
</body>
</html>
