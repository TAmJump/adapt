name: Deploy Worker (adapt-api)

on:
  push:
    branches: [main]
    paths:
      - 'assets/worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy adapt-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b9de28abfd009bbf696ceec4da62c5b8
          wranglerVersion: "4"
          command: deploy --keep-vars
# 鍵（CLOUDFLARE_API_TOKEN）はリポジトリの Secrets に登録済み
